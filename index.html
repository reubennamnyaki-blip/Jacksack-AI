<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  color: white;
  background:
    radial-gradient(circle at 20% 20%, #4f46e5 0, transparent 30%),
    radial-gradient(circle at 80% 80%, #06b6d4 0, transparent 30%),
    #050816;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 30px 20px;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 100px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #67e8f9;
}

.badge {
  padding: 9px 16px;
  border: 1px solid #334155;
  border-radius: 30px;
  background: rgba(255,255,255,.05);
}

.hero {
  text-align: center;
}

.hero h1 {
  font-size: clamp(45px, 8vw, 80px);
  line-height: 1;
  margin-bottom: 25px;
  background: linear-gradient(90deg,#67e8f9,#818cf8,#c084fc);
  -webkit-background-clip: text;
  color: transparent;
}

.hero p {
  color: #94a3b8;
  font-size: 18px;
  margin-bottom: 40px;
}

.chat-box {
  max-width: 700px;
  margin: auto;
  padding: 8px;
  border-radius: 22px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: 0 20px 70px rgba(0,0,0,.4);
}

.chat-box input {
  width: 75%;
  padding: 18px;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 16px;
}

.chat-box button {
  padding: 16px 25px;
  border: none;
  border-radius: 16px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(135deg,#6366f1,#06b6d4);
}

.cards {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 18px;
  margin-top: 70px;
}

.card {
  padding: 25px;
  border-radius: 20px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
  transition: .3s;
}

.card:hover {
  transform: translateY(-8px);
  border-color: #67e8f9;
}

.card h3 {
  margin-bottom: 10px;
}

.card p {
  color: #94a3b8;
  line-height: 1.5;
}

@media(max-width:700px) {
  .cards {
    grid-template-columns: 1fr;
  }

  .chat-box input {
    width: 65%;
  }
}
</style>
</head>

<body>

<div class="container">

<nav>
  <div class="logo">✦ MY AI</div>
  <div class="badge">AI Assistant</div>
</nav>

<section class="hero">
  <h1>Your AI.<br>Your Future.</h1>

  <p>
    Ask anything. Create anything. Learn faster with your personal AI.
  </p>

  <div class="chat-box">
    <input type="text" placeholder="Ask your AI anything...">
    <button>Ask AI</button>
  </div>
</section>

<section class="cards">

  <div class="card">
    <h3>🤖 Smart AI</h3>
    <p>Get intelligent answers and useful ideas instantly.</p>
  </div>

  <div class="card">
    <h3>⚡ Fast</h3>
    <p>Designed for quick and smooth conversations.</p>
  </div>

  <div class="card">
    <h3>✨ Creative</h3>
    <p>Create, write, learn and explore with AI.</p>
  </div>

</section>

</div>

</body>
      </html>
