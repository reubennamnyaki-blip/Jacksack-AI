<!DOCTYPE html>
<html>
<head>
<title>Jacksack-AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0}
.header{background:#2563eb;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.chat-box{height:75vh;overflow-y:auto;padding:15px}
.message{background:#1e293b;padding:10px;margin:10px 0;border-radius:10px}
.user{background:#2563eb;text-align:right}
.input-area{display:flex;padding:10px;background:#1e293b;position:fixed;bottom:0;width:100%;box-sizing:border-box}
input{flex:1;padding:12px;border-radius:20px;border:none}
button{background:#2563eb;color:white;border:none;padding:12px 20px;border-radius:20px;margin-left:10px}
</style>
</head>
<body>
<div class="header">Jacksack-AI 🤖</div>
<div class="chat-box" id="chat">
<div class="message">Habari! Mimi ni Jacksack-AI. Uliza chochote!</div>
</div>
<div class="input-area">
<input id="userInput" placeholder="Andika swali...">
<button onclick="send()">Send</button>
</div>
<script>
function send(){
let i=document.getElementById('userInput');
let c=document.getElementById('chat');
if(i.value=='')return;
c.innerHTML+='<div class=message user>'+i.value+'</div>';
setTimeout(()=>{c.innerHTML+='<div class=message>AI: Nimepokea - '+i.value+'</div>';c.scrollTop=c.scrollHeight},500);
i.value='';c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>
