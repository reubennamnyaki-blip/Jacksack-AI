<!DOCTYPE html>
<html>
<head>
<title>Jack AI - Professional Dental Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{font-family:'Poppins',sans-serif}
body{margin:0;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh}
header{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);color:white;padding:30px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.2)}
header h1{font-size:40px;margin:0;text-shadow:0 2px 10px rgba(0,0,0,0.3)}
.card{max-width:750px;margin:20px auto;background:white;border-radius:20px;padding:20px;box-shadow:0 15px 35px rgba(0,0,0,0.2)}
#messages{height:400px;overflow-y:auto;padding:15px;background:#f8f9ff;border-radius:15px}
.msg{margin:10px 0;padding:12px 18px;border-radius:20px;max-width:80%;animation:fadeIn 0.3s}
.user{background:linear-gradient(135deg,#667eea,#764ba2);color:white;margin-left:auto;border-bottom-right-radius:5px}
.bot{background:white;border:1px solid #e0e0e0;box-shadow:0 2px 5px rgba(0,0,0,0.05);border-bottom-left-radius:5px}
.input-area{display:flex;gap:10px;margin-top:15px;background:#f0f2f5;padding:10px;border-radius:30px}
.input-area input{flex:1;border:none;background:transparent;padding:10px;outline:none}
.input-area button{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;padding:12px 25px;border-radius:25px;cursor:pointer;font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.q-btn{background:white;border:2px solid #667eea;color:#667eea;padding:12px;border-radius:12px;cursor:pointer;font-weight:600;transition:0.3s}
.q-btn:hover{background:#667eea;color:white;transform:translateY(-2px)}
.ad{background:linear-gradient(135deg,#ffeaa7,#fab1a0);padding:15px;text-align:center;border-radius:15px;margin:15px;font-weight:600}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<header>
<h1>🦷 JACK AI</h1>
<p>Professional Dental Intelligence • For Students & Doctors</p>
</header>

<div class="card">
<div class="ad">✨ AD SPACE - Your Earnings Will Appear Here ✨</div>
<div id="messages">
<div class="msg bot">👋 Hello Doctor! I'm <b>Jack AI</b>, your advanced dental assistant.<br><br>I can explain any dental topic from Diploma to PhD level with modern graphics.<br><br>Ask me anything! 🦷</div>
</div>

<div class="input-area">
<input id="q" placeholder="Ask any dental question...">
<button onclick="ask()">Send 🚀</button>
</div>

<div class="quick">
<button class="q-btn" onclick="quick('Tooth Extraction')">🦷 Extraction</button>
<button class="q-btn" onclick="quick('Dental Caries')">🔬 Caries</button>
<button class="q-btn" onclick="quick('Dental Implant')">⚙️ Implant</button>
<button class="q-btn" onclick="quick('Dental X-ray')">📸 X-Ray</button>
</div>
</div>

<script>
const knowledge={
"caries":"🦷 <b>Dental Caries:</b><br>• Cause: Streptococcus mutans<br>• Stages: White spot > Enamel decay > Dentin > Pulp<br>• Treatment: Fluoride, GIC/Composite Filling, RCT, Crown<br>• Prevention: Brush 2x, Floss, Less sugar",
"extraction":"🦷 <b>Tooth Extraction Protocol:</b><br>1. Anesthesia (Lidocaine 2%)<br>2. Elevator to luxate<br>3. Forceps extraction<br>4. Socket compression<br>5. Gauze pack + Post-op instructions",
"implant":"⚙️ <b>Dental Implant:</b><br>• Material: Titanium<br>• Steps: CBCT > Placement > 3-6 months healing > Crown<br>• Success: 95%<br>• Contra: Uncontrolled diabetes, smoking",
"x-ray":"📸 <b>Dental X-Rays:</b><br>• Bitewing: Interproximal caries<br>• Periapical: Root & abscess<br>• OPG: Full mouth<br>• CBCT: 3D for implants",
"pain":"🚨 <b>Tooth Pain Emergency:</b><br>• Ibuprofen 400mg TID<br>• Clove oil (eugenol)<br>• Warm salt water<br>• Visit dentist within 24h - may need RCT"
};
function ask(){
let i=document.getElementById('q'); let t=i.value.toLowerCase(); if(!t) return;
addMsg(i.value,'user'); let a="🤖 I'm still learning that. Try: Caries, Extraction, Implant, X-ray, Pain. Or ask me in detail!";
for(let k in knowledge){ if(t.includes(k)){ a=knowledge[k]; break; } }
setTimeout(()=>addMsg(a,'bot'),600); i.value='';
}
function quick(t){ document.getElementById('q').value=t; ask(); }
function addMsg(t,c){
let d=document.createElement('div'); d.className='msg '+c; d.innerHTML=t;
document.getElementById('messages').appendChild(d);
document.getElementById('messages').scrollTop=9999;
}
document.getElementById('q').addEventListener('keypress',e=>{ if(e.key==='Enter') ask(); });
</script>
</body>
</html>
